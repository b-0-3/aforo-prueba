<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar · Aforo</title>
<meta name="theme-color" content="#0D0E13">
<meta name="robots" content="noindex">
<link rel="icon" href="../img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../img/icon-180.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="../css/aforo.css">
</head>
<body>
<main class="wrap main">
  <div class="auth">
    <a class="brand" href="../"><svg viewBox="0 0 34 22" aria-hidden="true"><rect x="2.2" y="4" width="2.6" height="15" rx="1.3" fill="var(--brass)"/><rect x="29.2" y="4" width="2.6" height="15" rx="1.3" fill="var(--brass)"/><circle cx="3.5" cy="3.6" r="2.6" fill="var(--brass)"/><circle cx="30.5" cy="3.6" r="2.6" fill="var(--brass)"/><rect x="0" y="18.6" width="7" height="2.6" rx="1.2" fill="var(--brass)"/><rect x="27" y="18.6" width="7" height="2.6" rx="1.2" fill="var(--brass)"/><path d="M4.8 6.4 Q17 19 29.2 6.4" fill="none" stroke="var(--rope)" stroke-width="2.6" stroke-linecap="round"/></svg><span>aforo</span></a>
    <div id="view"></div>
  </div>
</main>

<script type="module">
  import { configured, auth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, updateProfile, notConfiguredHtml } from "../js/firebase.js";
  import { $, esc, delegate } from "../js/ui.js";
  import { createOrg, authError } from "../js/app/account.js";

  const view = $("#view");
  let mode = location.hash === "#registro" ? "registro" : "entrar", type = "local", working = false;

  if (!configured) view.innerHTML = notConfiguredHtml();
  else {
    // Si ya has entrado, directo al panel
    const off = onAuthStateChanged(auth, u => { off(); if (u && !working) location.replace("./"); else render(); });
  }

  function render(msg) {
    const tabs = '<div class="seg" role="group" aria-label="Acceso"><button data-act="mode" data-id="entrar" aria-pressed="' + (mode === "entrar") + '">Entrar</button><button data-act="mode" data-id="registro" aria-pressed="' + (mode === "registro") + '">Crear cuenta</button></div>';
    let body = "";
    if (mode === "entrar") {
      body = '<div class="page-head"><h1 class="h1">Hola de nuevo</h1><p class="lead">Entra para ver tu panel, la puerta, la barra o tu cuenta de RRPP.</p></div>' +
        '<form class="form" id="f"><div class="field"><label for="email">Email</label><input id="email" type="email" inputmode="email" autocomplete="email" required></div>' +
        '<div class="field"><label for="pass">Contraseña</label><input id="pass" type="password" autocomplete="current-password" required></div>' +
        '<p class="err" id="err" hidden></p><button class="btn btn-primary btn-block" type="submit">Entrar</button>' +
        '<button class="linkbtn" type="button" data-act="mode" data-id="olvido">He olvidado mi contraseña</button></form>';
    } else if (mode === "registro") {
      body = '<div class="page-head"><h1 class="h1">Crea tu cuenta</h1><p class="lead">Gratis. Para tu local o tu promotora. Si te ha invitado alguien de un equipo, usa el enlace que te pasaron.</p></div>' +
        '<form class="form" id="f">' +
        '<div class="field"><span class="lbl">¿Qué eres?</span><div class="seg" role="group"><button type="button" data-act="type" data-id="local" aria-pressed="' + (type === "local") + '">Local o discoteca</button><button type="button" data-act="type" data-id="promotora" aria-pressed="' + (type === "promotora") + '">Promotora</button></div></div>' +
        '<div class="field"><label for="org">Nombre del ' + (type === "local" ? "local" : "colectivo o promotora") + '</label><input id="org" required autocomplete="organization" placeholder="' + (type === "local" ? "Ej. Sala Nébula" : "Ej. Colectivo Ruido") + '"></div>' +
        '<div class="field"><label for="area">Zona</label><input id="area" placeholder="Ej. Malasaña, Madrid"></div>' +
        '<div class="field"><label for="name">Tu nombre</label><input id="name" autocomplete="name" required></div>' +
        '<div class="field"><label for="email">Email</label><input id="email" type="email" inputmode="email" autocomplete="email" required></div>' +
        '<div class="field"><label for="pass">Contraseña (mínimo 6 caracteres)</label><input id="pass" type="password" autocomplete="new-password" minlength="6" required></div>' +
        '<p class="err" id="err" hidden></p><button class="btn btn-primary btn-block" type="submit">Crear cuenta</button></form>';
    } else {
      body = '<div class="page-head"><h1 class="h1">Recuperar contraseña</h1><p class="lead">Te mandamos un email para crear una nueva.</p></div>' +
        '<form class="form" id="f"><div class="field"><label for="email">Email</label><input id="email" type="email" inputmode="email" autocomplete="email" required></div>' +
        (msg ? '<div class="notice notice-rope"><p>' + esc(msg) + '</p></div>' : '') +
        '<p class="err" id="err" hidden></p><button class="btn btn-primary btn-block" type="submit">Enviar email</button>' +
        '<button class="linkbtn" type="button" data-act="mode" data-id="entrar">Volver a entrar</button></form>';
    }
    view.innerHTML = (mode === "olvido" ? "" : tabs) + body;
    $("#f").addEventListener("submit", submit);
  }

  function fail(e) { working = false; const el = $("#err"); el.textContent = authError(e); el.hidden = false; const b = $("#f button[type=submit]"); if (b) { b.disabled = false; } }

  async function submit(ev) {
    ev.preventDefault();
    const b = $("#f button[type=submit]"); b.disabled = true; $("#err").hidden = true;
    const email = $("#email").value.trim();
    try {
      if (mode === "entrar") {
        working = true;
        await signInWithEmailAndPassword(auth, email, $("#pass").value);
        location.replace("./");
      } else if (mode === "registro") {
        const orgName = $("#org").value.trim(), name = $("#name").value.trim(), area = $("#area").value.trim();
        if (!orgName || !name) { fail({ message: "Rellena el nombre del " + (type === "local" ? "local" : "colectivo") + " y tu nombre." }); return; }
        working = true;
        const cred = await createUserWithEmailAndPassword(auth, email, $("#pass").value);
        try { await updateProfile(cred.user, { displayName: name }); } catch (e) { /* no pasa nada */ }
        await createOrg(cred.user, { name, orgName, type, area });
        location.replace("./#ajustes");
      } else {
        await sendPasswordResetEmail(auth, email);
        render("Listo. Si hay una cuenta con " + email + ", te llegará un email en un minuto. Mira también en spam.");
      }
    } catch (e) { console.error(e); fail(e); }
  }

  delegate(view, {
    mode(d) { mode = d.id; history.replaceState(null, "", mode === "registro" ? "#registro" : location.pathname); render(); },
    type(d) {
      const keep = ["org", "area", "name", "email", "pass"].reduce((a, k) => { const el = document.getElementById(k); a[k] = el ? el.value : ""; return a; }, {});
      type = d.id; render();
      Object.keys(keep).forEach(k => { const el = document.getElementById(k); if (el) el.value = keep[k]; });
    }
  });
</script>
</body>
</html>
