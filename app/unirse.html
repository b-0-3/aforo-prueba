<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Únete al equipo · Aforo</title>
<meta name="theme-color" content="#0D0E13">
<meta name="robots" content="noindex">
<link rel="icon" href="../img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../img/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="../css/aforo.css">
</head>
<body>
<main class="wrap main">
  <div class="auth">
    <a class="brand" href="../"><svg viewBox="0 0 34 22" aria-hidden="true"><rect x="2.2" y="4" width="2.6" height="15" rx="1.3" fill="var(--brass)"/><rect x="29.2" y="4" width="2.6" height="15" rx="1.3" fill="var(--brass)"/><circle cx="3.5" cy="3.6" r="2.6" fill="var(--brass)"/><circle cx="30.5" cy="3.6" r="2.6" fill="var(--brass)"/><rect x="0" y="18.6" width="7" height="2.6" rx="1.2" fill="var(--brass)"/><rect x="27" y="18.6" width="7" height="2.6" rx="1.2" fill="var(--brass)"/><path d="M4.8 6.4 Q17 19 29.2 6.4" fill="none" stroke="var(--rope)" stroke-width="2.6" stroke-linecap="round"/></svg><span>aforo</span></a>
    <div id="view"><div class="loading"><span class="spin spin-sm"></span>Cargando…</div></div>
  </div>
</main>

<script type="module">
  import { configured, auth, db, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, signOut, doc, getDoc, writeBatch, serverTimestamp, notConfiguredHtml } from "../js/firebase.js";
  import { $, esc, delegate } from "../js/ui.js";
  import { authError, ROLE_NAMES } from "../js/app/account.js";

  const view = $("#view");
  const code = new URLSearchParams(location.search).get("c");
  let mode = "registro", user = null;

  const WHAT = {
    admin: "Podrás gestionar eventos, RRPP, listas, mesas, puerta y barra.",
    puerta: "Validarás las entradas con la cámara del móvil y dejarás pasar a la gente de la lista.",
    barra: "Cobrarás en la barra y verás los pedidos que llegan desde las mesas.",
    rrpp: "Tendrás tu enlace para vender, tus ventas, tu comisión y tu lista de invitados."
  };

  if (!configured) view.innerHTML = notConfiguredHtml();
  else if (!code) view.innerHTML = '<div class="notice"><b>A este enlace le falta el código.</b><p class="small">Pide a tu encargado que te pase otra vez la invitación.</p></div>';
  else onAuthStateChanged(auth, u => { user = u; u ? showInvite() : renderAuth(); });

  function renderAuth() {
    view.innerHTML = '<div class="page-head"><p class="eyebrow">Invitación</p><h1 class="h1">Te han invitado a un equipo</h1><p class="lead">Crea tu usuario (o entra si ya tienes uno) y te unes en un toque.</p></div>' +
      '<div class="seg" role="group"><button data-act="mode" data-id="registro" aria-pressed="' + (mode === "registro") + '">Crear usuario</button><button data-act="mode" data-id="entrar" aria-pressed="' + (mode === "entrar") + '">Ya tengo usuario</button></div>' +
      '<form class="form" id="f">' +
      (mode === "registro" ? '<div class="field"><label for="name">Tu nombre</label><input id="name" autocomplete="name" required></div>' : '') +
      '<div class="field"><label for="email">Email</label><input id="email" type="email" inputmode="email" autocomplete="email" required></div>' +
      '<div class="field"><label for="pass">Contraseña' + (mode === "registro" ? ' (mínimo 6 caracteres)' : '') + '</label><input id="pass" type="password" autocomplete="' + (mode === "registro" ? "new-password" : "current-password") + '" required></div>' +
      '<p class="err" id="err" hidden></p><button class="btn btn-primary btn-block" type="submit">Continuar</button></form>';
    $("#f").addEventListener("submit", async ev => {
      ev.preventDefault();
      const b = $("#f button[type=submit]"); b.disabled = true; $("#err").hidden = true;
      try {
        if (mode === "registro") {
          const name = $("#name").value.trim();
          const cred = await createUserWithEmailAndPassword(auth, $("#email").value.trim(), $("#pass").value);
          try { await updateProfile(cred.user, { displayName: name }); } catch (e) { /* nada */ }
        } else {
          await signInWithEmailAndPassword(auth, $("#email").value.trim(), $("#pass").value);
        }
      } catch (e) { b.disabled = false; $("#err").textContent = authError(e); $("#err").hidden = false; }
    });
  }

  async function showInvite() {
    view.innerHTML = '<div class="loading"><span class="spin spin-sm"></span>Leyendo la invitación…</div>';
    let inv;
    try { const s = await getDoc(doc(db, "invites", code)); inv = s.exists() ? s.data() : null; }
    catch (e) { inv = null; }
    if (!inv) { view.innerHTML = '<div class="notice"><b>Esta invitación no existe.</b><p class="small">Puede que la hayan borrado. Pide otra a tu encargado.</p></div>'; return; }
    if (inv.used) {
      view.innerHTML = '<div class="notice"><b>Esta invitación ya se ha usado.</b><p class="small">' + (inv.usedBy === user.uid ? 'Ya estás dentro del equipo.' : 'Cada invitación sirve para una sola persona. Pide otra a tu encargado.') + '</p></div>' +
        (inv.usedBy === user.uid ? '<a class="btn btn-primary" href="./">Ir a mi panel</a>' : '');
      return;
    }
    view.innerHTML = '<div class="page-head"><p class="eyebrow">Invitación</p><h1 class="h1">' + esc(inv.orgName || "Tu equipo") + '</h1>' +
      '<p class="lead">Te unes como <b>' + esc(ROLE_NAMES[inv.role] || inv.role) + '</b>. ' + esc(WHAT[inv.role] || "") + '</p></div>' +
      '<div class="card"><p class="small">Entras como <b>' + esc(user.email) + '</b>. Si tu usuario ya pertenecía a otro equipo, pasarás a este.</p>' +
      '<p class="err" id="err" hidden></p><div class="row"><button class="btn btn-primary" data-act="join">Unirme al equipo</button><button class="btn" data-act="out">No soy yo</button></div></div>';
    view._inv = inv;
  }

  delegate(view, {
    mode(d) { mode = d.id; renderAuth(); },
    out() { signOut(auth); },
    async join(d, b) {
      const inv = view._inv; b.disabled = true;
      try {
        const batch = writeBatch(db);
        batch.set(doc(db, "orgs", inv.orgId, "members", user.uid), {
          role: inv.role, name: user.displayName || inv.name || user.email, email: user.email || "",
          rrppId: inv.rrppId || null, inviteCode: code, joinedAt: serverTimestamp()
        });
        batch.update(doc(db, "invites", code), { used: true, usedBy: user.uid });
        batch.set(doc(db, "users", user.uid), { orgId: inv.orgId, role: inv.role, name: user.displayName || inv.name || "" });
        await batch.commit();
        location.replace("./");
      } catch (e) {
        console.error(e); b.disabled = false;
        $("#err").textContent = authError(e); $("#err").hidden = false;
      }
    }
  });
</script>
</body>
</html>
