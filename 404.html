<title>Página no encontrada · Aforo</title>
<meta name="theme-color" content="#0D0E13">
<script>
  // GitHub Pages enseña esta página en cualquier dirección que no exista.
  // Calculamos dónde está la web para que estilos y enlaces funcionen.
  (function () {
    var seg = location.pathname.split("/")[1];
    var base = /\.github\.io$/.test(location.hostname) && seg ? "/" + seg + "/" : "/";
    document.write('<base href="' + base + '">');
  })();
</script>
